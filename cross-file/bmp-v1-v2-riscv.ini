# This a cross-file for the v1 & v2 Black Magic Probes. It defines a default configuration profile that
# provides only support for both RISC-V architectures and support for RISC-V targets.
# This includes support for the GD32V parts, and RP2350

[binaries]
c = 'arm-none-eabi-gcc'
cpp = 'arm-none-eabi-g++'
ld = 'arm-none-eabi-gcc'
ar = 'arm-none-eabi-ar'
nm = 'arm-none-eabi-nm'
strip = 'arm-none-eabi-strip'
objcopy = 'arm-none-eabi-objcopy'
objdump = 'arm-none-eabi-objdump'
size = 'arm-none-eabi-size'

[host_machine]
system = 'bare-metal'
cpu_family = 'arm'
cpu = 'arm'
endian = 'little'

[project options]
probe = 'bmp-v1-v2'
targets = 'riscv32,riscv64,gd32,rp'
rtt_support = false
bmd_bootloader = true
